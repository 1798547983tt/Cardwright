# 样例：正文美化装配单
# 预设 cinema（复古电影）
# 将正文格式标签映射到版面角色

前端: 正文美化
预设: cinema
根标签: content
楼层: 10
状态头: false

# 模块：标签 → 角色的映射
模块:
  # 页眉：时间等元信息
  - 标签: time
    角色: 页眉
  # 正文：主要叙事段落
  - 标签: story
    角色: 正文
  # 折叠：当前剧情摘要，默认收起
  - 标签: now_plot
    角色: 折叠
    显示: 当前剧情

# 自定义区块：追加在正文末尾（CSS 只用令牌）
自定义区块:
  - HTML: '<p class="cw-note">本卡由样卡工坊制作。</p>'
    CSS: '.cw-note { color: var(--text-3); font-size: 12px; }'
