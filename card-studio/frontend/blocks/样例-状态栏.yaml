# 样例：状态栏装配单
# 预设 washi（和纸），形态 placeholder（每楼一个 iframe）
# 用于演示状态栏的各种区块类型

前端: 状态栏
形态: placeholder
预设: washi
标题: 样卡
折叠: true

# 摘要：折叠时露出的一行
摘要:
  - 变量: /主角/生命
    显示: 生命
  - 变量: /主角/状态

# 分页：三页，分别展示状态、人物和记录
分页:
  - 名称: 状态
    图标: heart
    区块:
      # stats 区块：标签/值网格
      - 类型: stats
        标题: 主角
        项:
          - 变量: /主角/姓名
            显示: 姓名
          - 变量: /主角/生命
          - 变量: /主角/状态
          - 变量: /主角/在逃
      # bars 区块：胶囊进度条（只接受有范围的数值）
      - 类型: bars
        项:
          - 变量: /主角/生命
            显示: 生命
      # crisis 区块：档位条
      - 类型: crisis
        变量: /主角/生命
        档位:
          - { 至: 30, 名称: 濒死, 色: danger }
          - { 至: 70, 名称: 受伤, 色: warn }
          - { 名称: 安好, 色: ok }

  - 名称: 人物
    图标: users
    区块:
      # relation 区块：关系卡（注意流式映射里 {键} 要加引号）
      - 类型: relation
        变量: /人物
        字段: { 好感: '/人物/{键}/好感', 所在: '/人物/{键}/所在' }
        进度: /人物/{键}/好感
      # tags 区块
      - 类型: tags
        标题: 货币
        变量: /货币

  - 名称: 记录
    图标: scroll
    区块:
      # timeline 区块：竖向时间线
      - 类型: timeline
        变量: /事件记录
        最近: 4
      # fold 区块：折叠面板（不可嵌套 fold）
      - 类型: fold
        标题: 任务
        区块:
          - 类型: list
            变量: /任务
            字段: { 标题: /任务/-/标题 }
      # delta 区块：变动徽章
      - 类型: delta
        项: [{ 变量: /主角/生命, 显示: 生命 }]
      # text 区块：静态文字
      - 类型: text
        文本: 记录只显示最近几条。
      # custom 区块：自定义 HTML（CSS 只用令牌）
      - 类型: custom
        HTML: '<div class="cw-seal">样卡</div>'
        CSS: '.cw-seal { color: var(--accent); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px 8px; }'
