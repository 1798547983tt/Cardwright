# 样例：创角页装配单
# 预设 neon（霓虹夜）
# 三步创角 + 应用自动追加的核对清单

前端: 创角页
预设: neon
标题: 样卡 · 入港登记

# 步骤：2–8 步，最后一步由应用自动添加核对清单
步骤:
  # 第一步：身份信息
  - 名称: 身份
    字段:
      # 文本字段：单行输入
      - 键: 姓名
        类型: 文本
        必填: true
        提示: 你的名字
        写入: /主角/姓名
      # 单选字段
      - 键: 状态
        类型: 单选
        选项: [正常, 受伤]
        写入: /主角/状态
      # 滑杆字段：需要 范围
      - 键: 生命
        类型: 滑杆
        范围: [1, 100]
        写入: /主角/生命

  # 第二步：关系
  - 名称: 关系
    字段:
      # 人物列表字段：多选但限制人数
      - 键: 熟人
        类型: 人物列表
        选项: [林砚, 老周]
        最多: 2

  # 第三步：自定义开局
  - 名称: 自定义开局
    自定义开局: true
    字段:
      # 长文本字段
      - { 键: 补充, 类型: 长文本, 提示: 想加什么都写在这里 }

# 写入：提交时执行的操作
写入:
  # 世界书条目：用模板填充玩家信息
  世界书条目:
    名称: '[样卡] 初始人物设定'
    模板: |
      玩家：{姓名}，状态{状态}，生命{生命}。熟人：{熟人}。
      {补充}
  # 开场信息：填入输入框
  开场信息: |
    （{姓名}走进港口）
  # 初始变量：把带 写入: 的字段写进 MVU
  初始变量: true
